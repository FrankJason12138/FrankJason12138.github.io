{% if site.comments.waline %}
  <section class="comment-section">
    <h3 class="comments-title">发表评论</h3>
    
    <!-- 评论表单 -->
    <div class="comment-card">
      <form id="comment-form" class="comment-form">
        <input type="text" name="nick" placeholder="昵称（选填）" />
        <input type="email" name="mail" placeholder="邮箱（选填）" />
        <input type="url" name="site" placeholder="网站（选填）" />
        <textarea name="comment" placeholder="写下你的评论..." required></textarea>
        <input type="hidden" name="url" value="{{ page.url }}" />
        <input type="hidden" name="parent_id" value="" />
        <button type="submit" class="submit-btn">🚀 提交评论</button>
        <p class="form-hint">昵称和邮箱为选填项，不填写也能发表评论</p>
      </form>
    </div>

    <!-- 评论列表 -->
    <div id="comments-list" class="comments-list"></div>
    
    <!-- 空状态 -->
    <div id="comments-empty" class="comments-empty" style="display: none;">
      <div class="comments-empty-icon">💭</div>
      <p>还没有评论，快来抢沙发吧！</p>
    </div>
  </section>

  <link rel="stylesheet" href="{{ "/assets/css/comment-style.css" | relative_url }}">

  <script>
    const WORKER_URL = '{{ site.comments.waline_serverUrl }}';
    const PAGE_URL = '{{ page.url }}';
    
    // 获取随机卡通头像 emoji
    const avatarEmojis = ['🐱', '🐶', '🐰', '🐼', '🦊', '🦁', '🐸', '🐵', '🐻', '🐨', '🦄', '🐯', '🦋', '🌸', '🌈', '⭐'];
    function getRandomEmoji() {
      return avatarEmojis[Math.floor(Math.random() * avatarEmojis.length)];
    }

    // 获取存储的昵称
    function getStoredNick() {
      return localStorage.getItem('waline_nick') || '';
    }
    function getStoredMail() {
      return localStorage.getItem('waline_mail') || '';
    }
    function getStoredSite() {
      return localStorage.getItem('waline_site') || '';
    }
    
    // 保存用户信息
    function saveUserInfo(nick, mail, site) {
      if (nick) localStorage.setItem('waline_nick', nick);
      if (mail) localStorage.setItem('waline_mail', mail);
      if (site) localStorage.setItem('waline_site', site);
    }

    // 预填充表单
    document.addEventListener('DOMContentLoaded', function() {
      const nickInput = document.querySelector('input[name="nick"]');
      const mailInput = document.querySelector('input[name="mail"]');
      const siteInput = document.querySelector('input[name="site"]');
      
      if (nickInput) nickInput.value = getStoredNick();
      if (mailInput) mailInput.value = getStoredMail();
      if (siteInput) siteInput.value = getStoredSite();
    });
     
    async function loadComments() {
      try {
        const res = await fetch(`${WORKER_URL}api/comment?type=list&url=${encodeURIComponent(PAGE_URL)}&pageSize=100`);
        const data = await res.json();
        if (data.errno === 0 && data.data.comments) {
          if (data.data.comments.length === 0) {
            document.getElementById('comments-empty').style.display = 'block';
          } else {
            renderComments(data.data.comments);
          }
        }
      } catch (err) {
        console.error('[Comments] Load error:', err);
      }
    }

    function renderComments(comments) {
      const container = document.getElementById('comments-list');
      container.innerHTML = '';
       
      const grouped = {};
      comments.forEach(c => {
        if (!c.parent_id) {
          if (!grouped[c.id]) grouped[c.id] = { comment: c, replies: [] };
          else grouped[c.id].comment = c;
        } else {
          if (!grouped[c.parent_id]) grouped[c.parent_id] = { comment: null, replies: [] };
          grouped[c.parent_id].replies.push(c);
        }
      });

      Object.values(grouped).forEach(({ comment, replies }) => {
        if (comment) {
          const div = createCommentHTML(comment, false);
          container.appendChild(div);
          replies.forEach(reply => {
            const replyDiv = createCommentHTML(reply, true);
            container.appendChild(replyDiv);
          });
        }
      });
    }

    function createCommentHTML(comment, isNested) {
      const div = document.createElement('div');
      div.className = isNested ? 'comment-item nested' : 'comment-item';
      
      const nickname = comment.nickname || '匿名小可爱';
      const time = new Date(comment.created_at).toLocaleString('zh-CN', { 
        month: 'numeric', 
        day: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      
      div.innerHTML = `
        <div class="comment-header">
          <div class="comment-avatar">${getRandomEmoji()}</div>
          <div>
            <div class="comment-author">${escapeHtml(nickname)}</div>
            <div class="comment-time">${time}</div>
          </div>
        </div>
        <div class="comment-body">${escapeHtml(comment.content).replace(/\n/g, '<br>')}</div>
        <div class="comment-action">
          <a onclick="replyTo('${comment.id}', '${escapeHtml(nickname)}')">💬 回复</a>
        </div>
      `;
      return div;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    let currentReplyId = '';
    function replyTo(commentId, nickname) {
      currentReplyId = commentId;
      document.querySelector('input[name="parent_id"]').value = commentId;
      document.querySelector('textarea[name="comment"]').focus();
      document.querySelector('textarea[name="comment"]').placeholder = `回复 @${nickname}：`;
      window.scrollTo({ top: document.querySelector('.comment-section').offsetTop - 100, behavior: 'smooth' });
    }

    document.getElementById('comment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const nick = form.nick.value.trim();
      const mail = form.mail.value.trim();
      const site = form.site.value.trim();
      const comment = form.comment.value.trim();
      
      if (!comment) {
        alert('请输入评论内容');
        return;
      }

      const parentId = form.querySelector('input[name="parent_id"]').value || null;
      
      try {
        const res = await fetch(`${WORKER_URL}api/comment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            comment: {
              url: PAGE_URL,
              nick: nick || '匿名小可爱',
              mail: mail,
              site: site,
              comment: comment,
              parent_id: parentId
            }
          })
        });
        const data = await res.json();
        if (data.errno === 0) {
          // 保存用户信息
          saveUserInfo(nick, mail, site);
          
          alert('评论成功！🎉');
          form.reset();
          document.querySelector('input[name="parent_id"]').value = '';
          document.querySelector('textarea[name="comment"]').placeholder = '写下你的评论...';
          loadComments();
        } else {
          alert('提交失败：' + (data.errmsg || '未知错误'));
        }
      } catch (err) {
        console.error('[Comments] Submit error:', err);
        alert('提交失败，请稍后重试');
      }
    });

    // 页面加载后获取评论
    loadComments();
  </script>

  {% endif %}
